<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Modern Cyber Glow Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />    <!-- Neon Blue -->
      <stop offset="45%" style="stop-color:#8b5cf6" />   <!-- Indigo/Purple -->
      <stop offset="100%" style="stop-color:#ec4899" />  <!-- Hot Pink -->
    </linearGradient>
    
    <!-- Subtle Inner Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- Icon Inner Glow Filter -->
    <filter id="inner-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#ffffff" flood-opacity="0.5" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Squircle Base with Gradient & Glow -->
  <rect width="112" height="112" x="8" y="8" rx="30" fill="url(#bg-grad)" filter="url(#glow-shadow)" />

  <!-- 2. Inner Border for Premium Glassmorphic Look -->
  <rect width="110" height="110" x="9" y="9" rx="29" fill="none" stroke="url(#border-grad)" stroke-width="2" />

  <!-- 3. Decorative Abstract Alignment Lines (Background) -->
  <g opacity="0.25">
    <rect x="52" y="26" width="46" height="6" rx="3" fill="#ffffff" />
    <rect x="36" y="38" width="62" height="6" rx="3" fill="#ffffff" />
    <rect x="44" y="84" width="54" height="6" rx="3" fill="#ffffff" />
    <rect x="60" y="96" width="38" height="6" rx="3" fill="#ffffff" />
  </g>

  <!-- 4. Dynamic Leftward Double-Arrow (RTL & Velocity) -->
  <g filter="url(#inner-glow)">
    <!-- Primary Arrow Head -->
    <path d="M 28 64 L 52 40" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 28 64 L 52 88" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Secondary Ghost Arrow Head (Indicates speed/transition) -->
    <path d="M 44 64 L 64 44" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <path d="M 44 64 L 64 84" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    
    <!-- Main Horizontal Flow Line -->
    <path d="M 44 64 L 100 64" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  </g>

  <!-- 5. Sleek Sparkle dot (Indicating "Beautifier") -->
  <circle cx="34" cy="34" r="3.5" fill="#ffffff" opacity="0.9" />
  <circle cx="92" cy="88" r="2.5" fill="#ffffff" opacity="0.7" />
</svg>
